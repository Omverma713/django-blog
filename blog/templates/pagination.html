{% if page.has_other_pages %}
<div class="pagination-container">
  
  <!-- Previous Button -->
  {% if page.has_previous %}
    <a href="?page={{ page.previous_page_number }}" class="pagination-btn">
      <i class="fa-solid fa-chevron-left"></i>
      <span>Previous</span>
    </a>
  {% else %}
    <span class="pagination-btn pagination-disabled">
      <i class="fa-solid fa-chevron-left"></i>
      <span>Previous</span>
    </span>
  {% endif %}

  <!-- Numbered Page Buttons -->
  <div class="pagination-numbers">
    {% for num in page.paginator.page_range %}
      {% if num == page.number %}
        <span class="pagination-number active">{{ num }}</span>
      {% else %}
        <a href="?page={{ num }}" class="pagination-number">{{ num }}</a>
      {% endif %}
    {% endfor %}
  </div>

  <!-- Next Button -->
  {% if page.has_next %}
    <a href="?page={{ page.next_page_number }}" class="pagination-btn">
      <span>Next</span>
      <i class="fa-solid fa-chevron-right"></i>
    </a>
  {% else %}
    <span class="pagination-btn pagination-disabled">
      <span>Next</span>
      <i class="fa-solid fa-chevron-right"></i>
    </span>
  {% endif %}

</div>
{% endif %}
