<ul class="widget-list">
  {% for post in latest_posts %}
    <li class="widget-list-item">
      <i class="fa-solid fa-newspaper" style="color: var(--accent-primary); font-size: 14px;"></i>
      <a href="{{ post.get_absolute_url }}">{{ post.title }}</a>
      <i class="fa-solid fa-chevron-right" style="color: var(--text-subtle); font-size: 10px;"></i>
    </li>
  {% empty %}
    <li style="color: var(--text-subtle); font-size: 0.9rem;">No articles available.</li>
  {% endfor %}
</ul>
