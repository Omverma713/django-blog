<style>

/* ===== Latest Posts Section ===== */
.latest-posts{
    max-width:700px;
    margin:30px auto;
    padding:0;
    list-style:none;
}

/* ===== List Item ===== */
.latest-posts li{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    padding:18px 20px;
    margin-bottom:16px;
    border-radius:18px;
    transition:0.4s ease;
    position:relative;
    overflow:hidden;
    animation:fadeInUp 0.8s ease;
    border-left:4px solid #00c6ff;
}

/* Hover Effect */
.latest-posts li:hover{
    transform:translateX(8px);
    background:rgba(255,255,255,0.12);
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

/* Shine Animation */
.latest-posts li::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.15),
        transparent
    );
    transition:0.8s;
}

.latest-posts li:hover::before{
    left:100%;
}

/* ===== Links ===== */
.latest-posts li a{
    color:white;
    text-decoration:none;
    font-size:17px;
    font-weight:500;
    transition:0.3s ease;
}

/* Link Hover */
.latest-posts li a:hover{
    color:#00d4ff;
    letter-spacing:0.5px;
}

/* ===== Animation ===== */
@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ===== Responsive ===== */
@media (max-width:768px){

    .latest-posts li{
        padding:16px;
    }

    .latest-posts li a{
        font-size:15px;
    }
}

@media (max-width:480px){

    .latest-posts{
        margin:20px 10px;
    }

    .latest-posts li{
        padding:14px;
        border-radius:14px;
    }

    .latest-posts li a{
        font-size:14px;
    }
}

</style>

<ul class="latest-posts">

  {% for post in latest_posts %}

  <li>
    <a href="{{ post.get_absolute_url }}">
      {{ post.title }}
    </a>
  </li>

  {% endfor %}

</ul>
